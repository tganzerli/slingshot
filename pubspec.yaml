name: slingshot
description: >
  Shared contract for the slingshot database drivers for Dart: transaction
  lifecycle, repository interface, error types and native library loading.
version: 1.0.4

repository: https://github.com/tganzerli/slingshot
topics:
  - database
  - ffi
  - sql

environment:
  sdk: ^3.6.0

dependencies:
  ffi: ^2.1.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
